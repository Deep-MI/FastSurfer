# md5 is the checksum the hosts publish for the file. A download that does not match is retried, a
# checkpoint that already exists is checked too, but a mismatch only logs a warning and the file is kept.
# So the file behind a link (url + file name of path) must not change: publish a changed file under a
# new link and update the link and the md5 together.
checkpoint:
  axial:
    path: "checkpoints/aparc_vinn_axial_v2.0.0.pkl"
    md5: "f16e78dd069eed2ec659674e0fdb697b"
  coronal:
    path: "checkpoints/aparc_vinn_coronal_v2.0.0.pkl"
    md5: "fa699af3d60ca9ee06950e62ed04c288"
  sagittal:
    path: "checkpoints/aparc_vinn_sagittal_v2.0.0.pkl"
    md5: "f28ab87df75492ad91f9ff5e49a2583c"

config:
