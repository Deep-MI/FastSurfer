# Compares one processed subject against reference data with the pipelinetest pytest suite.
# The calling job has to have checked this repository out, and either processed the subject on the
# same runner or produced the artifact that load-processed fetches.

name: 'Run pipelinetest'
description: 'Runs the pipelinetest suite against reference data'

inputs:
  subject-id:
    type: string
    description: "The name of the case folder"
    required: true
  artifact-id:
    type: string
    description: >
      Name for the uploaded JUnit artifact and its file, defaulting to subject-id. Should carry no dot.
    default: ""
  subjects-dir:
    type: string
    description: "Path to the subjects-dir"
    default: "/tmp/subjects"
  reference-dir:
    type: string
    description: "Path to the reference-dir"
    default: "/tmp/reference"
  case-href:
    required: true
    type: string
    description: "The url to the reference file to download for comparison"
  junit-dir:
    default: /tmp
    type: string
    description: >
      Directory the JUnit-XML file is written to. It is named after its artifact, so that files
      downloaded from several runs sit next to each other.

runs:
  using: "composite"
  steps:
    - name: Resolve the artifact and JUnit file names
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        SUBJECT_ID: ${{ inputs.subject-id }}
        JUNIT_DIR: ${{ inputs.junit-dir }}
      run: |
        # Short sha: the full 40 characters make the downloaded name unreadable and carry no more
        # information. Same scheme as the processed-data artifact in run-fastsurfer.
        artifact="fastsurfer-${GITHUB_SHA::8}-junit-${ARTIFACT_ID:-$SUBJECT_ID}"
        mkdir -p "$JUNIT_DIR"
        echo "FS_JUNIT_ARTIFACT=$artifact" >> "$GITHUB_ENV"
        echo "FS_JUNIT_FILE=$JUNIT_DIR/$artifact.xml" >> "$GITHUB_ENV"
    - name: Setup uv and Python 3.10
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: '3.10'
    - name: Download and unpack reference data
      shell: bash
      env:
        CASE_HREF: ${{ inputs.case-href }}
        REF_DIR: ${{ inputs.reference-dir }}
      run: |
        echo "::group::Prepare processed and reference data"
        mkdir -p $REF_DIR
        if [[ -z "$CASE_HREF" ]] ; then
          echo "CASE_HREF is empty, so the reference data cannot be downloaded. If this is a"
          echo "  pull_request run on a fork, it cannot have the secrets."
          exit 1
        fi
        # --fail, so that an error page is not unpacked as if it were the reference archive.
        # --retry-all-errors as well as --retry, which on its own covers only 5xx, 408 and 429 and
        # so not the connection resets and stalled handshakes the host also produces.
        # --speed-limit with --speed-time, because neither --connect-timeout nor --retry bounds a
        # transfer that stalls after the handshake: curl would block to the job timeout without ever
        # returning the error a retry needs. A rate floor rather than --max-time, which would also
        # cut a download that is merely slow.
        curl --fail -k --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 \
          --speed-limit 1000 --speed-time 60 \
          "$CASE_HREF" -o "$REF_DIR/ref-download-data"
        tar xf "$REF_DIR/ref-download-data" -C "$REF_DIR"
        rm -f "$REF_DIR/ref-download-data"
        echo "::endgroup::"
    - name: Recover Case data
      uses: Deep-MI/FastSurfer/.github/actions/load-processed@dev
      with:
        subject-id: ${{ inputs.subject-id }}
        # without this the download asks for the subject-id name, which run-fastsurfer did not use
        artifact-id: ${{ inputs.artifact-id }}
        subjects-dir: ${{ inputs.subjects-dir }}
    # run pytest checks for data consistency/quality
    - name: Run pytest
      env:
        PYTHON_PATH: .
        FASTSURFER_HOME: ${{ github.workspace }}
        REF_DIR: ${{ inputs.reference-dir }}
      shell: bash
      continue-on-error: true  # pytest only exits with code 0, if all tests pass
      run: |
        echo "::group::Run tests"
        flags=("--junit-xml=$FS_JUNIT_FILE")
        if [[ "$ACTION_RUNNER_DEBUG" == "true" ]]
        then 
          flags+=(-vv --log_cli_level=DEBUG)
        fi
        uv run --extra pipelinetest python -m pytest "${flags[@]}" test/pipelinetest
        echo "::endgroup::"
    - name: Upload the the JUnit XML file as an artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.FS_JUNIT_ARTIFACT }}
        path: ${{ env.FS_JUNIT_FILE }}
