# This workflow file is a reusable workflow that will process a single T1 image with docker.
# The docker image can be built by workflow build-docker or on dockerhub (input image).
# The image will be downloaded
# The build artifact includes the image in docker-image.tar and the name of the image in image_name.env

name: 'Run Fastsurfer'
description: 'Runs FastSurfer'

inputs:
  docker-image:
    type: string
    description: "The fastsurfer image to use (default: use cached image from prior build-docker build)"
    default: "build-cached"
  subject-id:
    type: string
    description: "The name of the case folder"
    required: true
  artifact-id:
    type: string
    description: >
      Name for the uploaded artifact, defaulting to subject-id. Give one without a "." when the
      subject-id has one: GitHub serves artifacts as <name>.zip, and Safari on macOS reads
      "0.8mm.zip" as the extension, so a "0.8mm" artifact unpacks as "0".
    default: ""
  file-extension:
    type: string
    description: "The file extension of the image file to use (default: .nii.gz)."
    # Should start with "."
    default: ".nii.gz"
  extra-args:
    type: string
    description: "Extra FastSurfer arguments"
    default: ""
  image-href:
    required: true
    description: "The url to the file to download for processing"
  license:
    required: true
    description: "The FreeSurfer license"
  cleanup:
    type: string
    default: 'false'
    description: "Whether all docker images and containers should be cleaned"

runs:
  using: "composite"
  steps:
    - name: Set up FreeSurfer License and download T1 image
      # This is a failfast step and thus should be run first
      shell: bash
      id: prep
      continue-on-error: false
      env:
        IMAGE_HREF: ${{ inputs.image-href }}
        LICENSE: ${{ inputs.license }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        # Preparation code
        echo "::group::Check arguments and prepare directories"
        DATA_DIR=$(dirname $(pwd))/data
        echo "DATA_DIR=$DATA_DIR" >> $GITHUB_ENV  # DATA_DIR is used in the next 2 steps as well
        mkdir -p $DATA_DIR
        # checked explicitly: GitHub withholds these secrets from a pull_request run on a fork, and
        # an empty one has to be caught here rather than as a confusing failure much later
        for var in IMAGE_HREF LICENSE ; do
          if [[ -z "${!var}" ]] ; then
            echo "$var is empty. A pull_request run on a fork does not receive the secrets, by"
            echo "  design; merge the branch into a branch of this repository and test that instead."
            exit 1
          fi
        done
        # via the environment, so that a license containing a quote or a backtick cannot end up
        # being interpreted as part of this script
        printf '%s\n' "$LICENSE" > $DATA_DIR/.fs_license
        curl --fail -L -k "$IMAGE_HREF" -o "$DATA_DIR/T1${{ inputs.file-extension }}"
        if [[ "$EXTRA_ARGS" != "${EXTRA_ARGS/--threads/}" ]] || [[ "$EXTRA_ARGS" != "${EXTRA_ARGS/--parallel/}" ]] || [[ "$EXTRA_ARGS" != "${EXTRA_ARGS/--fs_license/}" ]] || [[ "$EXTRA_ARGS" != "${EXTRA_ARGS/--sd/}" ]] || [[ "$EXTRA_ARGS" != "${EXTRA_ARGS/--sid/}" ]] ; then
          echo "--threads, --parallel, --fs_license, --sid, --sd are not allowed in extra-args!"
          exit 1
        elif [[ "$EXTRA_ARGS" != "${EXTRA_ARGS/--surf_only/}" ]] && [[ ! -d "$DATA_DIR/${{ inputs.subject-id }}/mri" ]] ; then
          echo "Could not find subject folder for ${{ inputs.subject-id }}!"
          exit 1
        fi
        # Check if the docker needs to be loaded (fail if not)
        if [[ -z "$(docker images -q "${{ inputs.docker-image }}")" ]] ; then img_loaded="0" ; else img_loaded="1" ; fi
        echo "IMAGE_LOADED=$img_loaded" >> $GITHUB_OUTPUT
        echo "::endgroup::"
    - name: Load the docker image
      if: steps.prep.outputs.IMAGE_LOADED == 0
      id: load-docker
      uses: Deep-MI/FastSurfer/.github/actions/load-docker@dev
      with:
        docker-image: ${{ inputs.docker-image }}
    - name: FastSurfer Segmentation pipeline
      shell: bash
      if: ${{ ! contains( inputs.extra-args, '--surf_only' ) }}
      env:
        IMAGE_NAME: ${{ steps.prep.outputs.IMAGE_LOADED == 0 && steps.load-docker.outputs.image-name || inputs.docker-image }}
      run: |
        # Segmentation call
        echo "::group::FastSurfer Segmentation"
        # ISA pinned, see below. Here rather than in the image so that only CI pays for it.
        docker run -t -v "$DATA_DIR:/data" -u $(id -u):$(id -g) --env TQDM_DISABLE=1 \
          --env ATEN_CPU_CAPABILITY=avx2 --env ONEDNN_MAX_CPU_ISA=AVX2 \
          --name seg_container "$IMAGE_NAME" \
          --fs_license /data/.fs_license --t1 /data/T1${{ inputs.file-extension }} --sid "${{ inputs.subject-id }}" \
          --sd /data --threads $(nproc) --seg_only ${{ inputs.extra-args }}
        echo "::endgroup::"
    - name: FastSurfer Surface pipeline
      shell: bash
      if: ${{ ! contains( inputs.extra-args, '--seg_only' ) }}
      env:
        IMAGE_NAME: ${{ steps.prep.outputs.IMAGE_LOADED == 0 && steps.load-docker.outputs.image-name || inputs.docker-image }}
      run: |
        # Surface pipeline call
        echo "::group::FastSurfer Surface reconstruction"
        # ATEN_CPU_CAPABILITY and ONEDNN_MAX_CPU_ISA pin the vector kernels torch selects, which
        # otherwise follow whatever the runner exposes. Sampling the pool found three numerical
        # classes, so only about half of any two runs are comparable; pinning collapses the
        # convolution and softmax paths to one. avx2 rather than avx512 because the cap only works
        # downwards and some runners do not expose avx512 at all. Set here and not in the image so
        # that users keep the faster kernels: the penalty is roughly 50% on convolution.
        docker run -t -v "$DATA_DIR:/data" -u $(id -u):$(id -g) --env TQDM_DISABLE=1 \
          --env ATEN_CPU_CAPABILITY=avx2 --env ONEDNN_MAX_CPU_ISA=AVX2 \
          --name surf_container "$IMAGE_NAME" \
          --fs_license /data/.fs_license --t1 /data/T1${{ inputs.file-extension }} --sid "${{ inputs.subject-id }}" \
          --sd /data --threads $(nproc) --surf_only ${{ inputs.extra-args }}
        echo "::endgroup::"
    - name: Docker image and container cleanup
      if: inputs.cleanup == 'true'
      shell: bash
      run: |
        # Cleanup code
        echo "::group::Docker image and container cleanup"
        if [[ "${{ steps.prep.outputs.IMAGE_LOADED }}" == 0 ]] ; then docker image rm "${{ steps.load-docker.outputs.image-name }}" ; fi
        if [[ "${{ contains( inputs.extra-args, '--surf_only' ) }}" == "0" ]] ; then docker container rm seg_container ; fi
        if [[ "${{ contains( inputs.extra-args, '--seg_only' ) }}" == "0" ]] ; then docker container rm surf_container ; fi
        echo "::endgroup::"
    - name: Resolve the artifact name
      if: ${{ always() }}
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        SUBJECT_ID: ${{ inputs.subject-id }}
      run: |
        # Short sha: the full 40 characters make the downloaded name unreadable and carry no more
        # information. Must match load-processed, which downloads this artifact by name.
        echo "FS_ARTIFACT=fastsurfer-${GITHUB_SHA::8}-${ARTIFACT_ID:-$SUBJECT_ID}" >> "$GITHUB_ENV"
    - name: Save processed data
      if: ${{ always() && (steps.prep.outputs.IMAGE_LOADED != 0 || steps.load-docker.outcome == 'success') }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.FS_ARTIFACT }}
        path: ${{ env.DATA_DIR }}/${{ inputs.subject-id }}
