name: AUTO code-style
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  style:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: 'src'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'
      - name: Run Ruff
        run: uv run --project src --extra style ruff check src
      - name: Check the shell scripts and fs_time
        # --no-project on purpose: neither of these needs anything but pytest, so there is no reason
        # to resolve FastSurfer's dependencies for them. They take a few seconds together.
        # The lint only reads files. fs_time is python and branches on the platform, so its tests
        # belong here as well as on macOS: this is the run that covers the linux branches. What
        # needs a real bash 3.2 stays in the macos-shell-test job in unittest.yaml.
        run: >
          uv run --no-project --with pytest pytest -v
          src/test/shell/test_bash4_lint.py src/test/shell/test_fs_time.py
      - name: Run codespell
        uses: codespell-project/actions-codespell@master
        with:
          check_filenames: true
          check_hidden: true
          skip: 'src/build,src/doc/images,src/Tutorial,src/.git,src/.mypy_cache,src/.pytest_cache,src/.venv'
          ignore_words_file: src/.codespellignore
          path: 'src'
#      - name: Run pydocstyle
#        run: pydocstyle .
#      - name: Run bibclean
#        run: bibclean-check doc/references.bib
