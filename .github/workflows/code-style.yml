name: AUTO code-style
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  style:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: 'src'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'
      - name: Run Ruff
        run: uv run --project src --extra style ruff check src
      - name: Check the shell scripts for constructs macOS cannot run
        # --no-project on purpose: this only reads files and needs nothing but pytest, so there is no
        # reason to resolve FastSurfer's dependencies for it. Runs in about a second. The half of
        # test/shell that needs a real bash 3.2 runs in the macos-shell-test job in unittest.yaml.
        run: uv run --no-project --with pytest pytest -v src/test/shell/test_bash4_lint.py
      - name: Run codespell
        uses: codespell-project/actions-codespell@master
        with:
          check_filenames: true
          check_hidden: true
          skip: 'src/build,src/doc/images,src/Tutorial,src/.git,src/.mypy_cache,src/.pytest_cache,src/.venv'
          ignore_words_file: src/.codespellignore
          path: 'src'
#      - name: Run pydocstyle
#        run: pydocstyle .
#      - name: Run bibclean
#        run: bibclean-check doc/references.bib
