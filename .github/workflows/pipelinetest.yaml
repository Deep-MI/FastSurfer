name: pipelinetest

# File: pipelinetest.yaml
# Functionality: This workflow runs FastSurfer on MRI data and runs pytest to check if the results are acceptable. It
#  also checks if the FastSurfer environment and output already exist, and if not, it creates them.
# Usage: There are two ways to run this, both restricted to this repository. Run it from the Actions
#  tab (workflow-dispatch) on any branch, which tests that branch as it stands and reports on the
#  run; that is also how reference data is produced. Or let the nightly schedule run it on the
#  default branch, which it does only when that branch moved since the last one, plus once a week
#  whatever happened.
#
#  There is no trigger on a pull request. GitHub gives a pull request from a fork no secrets, and
#  must not, because the code under test runs in the same job as the FreeSurfer license, so the
#  label that used to start this could never work for a fork and produced a skipped check for every
#  unrelated label on every pull request. To test a branch before it lands, dispatch on it.
# Expected Secrets. They keep the old QUICKTEST_ prefix: a secret cannot be renamed, only deleted
# and recreated, and their contents are not to hand. Rename them when the reference data is next
# refreshed, which is when they have to be re-entered anyway.
#  - QUICKTEST_IMAGE_HREF_08mm: URL to a sample 0.8mm image
#  - QUICKTEST_IMAGE_HREF_1mm: URL to a sample 1mm image
#  - QUICKTEST_TARGET_HREF_08mm: URL to the reference processing of the sample 0.8mm image
#  - QUICKTEST_TARGET_HREF_1mm: URL to the reference processing of the sample 1mm image
#  - QUICKTEST_LICENSE: content of a FreeSurfer license file

concurrency:
  # One group per run, so nothing ever cancels anything. That is deliberate: the runner a job lands
  # on is not ours to choose, so dispatching one branch twice is how that variation gets sampled,
  # and a shared group made the second dispatch kill the first. Back to back, because then the
  # dependencies have not moved in between and the runner is what is left to differ. Cancel a
  # superseded run by hand.
  #
  # The cost, accepted rather than unnoticed: two builds can export the cache at once, and the
  # later export wins. A run that started before the weekly refresh exported still holds the old
  # layers, so it can put the old index back and cost that week its refresh. The window is the
  # build job only, since that is what exports, and it takes a dispatch on a Sunday morning to
  # reach it. The next weekly run repairs it.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

on:
  schedule:
    # Nightly, so a regression surfaces within a day rather than within a week. The job below turns
    # most of these into a no-op, see the schedule branch of the parse step for when it does not.
    # Not on the hour, which is when GitHub's scheduler is most congested and runs are delayed.
    # A Sunday that fails or never fires costs that week its cache refresh, which the next Sunday
    # repairs; keying the refresh on the weekday rather than on when it last happened is what buys
    # that, and it is the cheaper trade.
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      docker-image:
        description: 'Which docker image should be used to run this test (build-cached => build from the branch this runs on, or the name of an image to pull)'
        default: build-cached
        type: string
      freesurfer-build-image:
        description: 'FreeSurfer build image to build with ("" (default) => deepmi/fastsurfer-build:freesurferXXX; extract version from pyproject.toml)'
        type: string
      refresh-cache:
        description: 'Resolve the dependencies afresh rather than restoring the cached layers, and write the result back for later runs. The weekly scheduled run does this on its own.'
        default: false
        type: boolean

permissions:
  actions: read
  attestations: read
  checks: write
  contents: read
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  # no pull-requests: nothing here runs in the context of one any more. The results land on a check
  # run against the tested commit, which is what checks: write above is for.
  repository-projects: read
  security-events: read
  statuses: read

env:
  SUBJECTS_DIR: /tmp/subjects
  REFERENCE_DIR: /tmp/reference

jobs:
  build-docker:
    name: 'docker image build'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # A scheduled workflow runs on the default branch of whatever repository holds the file, and a
    # fork has neither the secrets nor a reason to burn three hours nightly. GitHub disables
    # schedules in forks by default, so this is the belt to that braces.
    if: github.repository == 'Deep-MI/FastSurfer'
    outputs:
      continue: ${{ steps.parse.outputs.CONTINUE }}
      docker-image: ${{ steps.parse.outputs.DOCKER_IMAGE }}
      extra-args: ${{ steps.parse.outputs.EXTRA_ARGS }}
      fs-build-image: ${{ steps.parse-version.outputs.FS_BUILD_IMAGE }}
      fs-version: ${{ steps.parse-version.outputs.FS_VERSION }}
      fs-version-short: ${{ steps.parse-version.outputs.FS_VERSION_SHORT }}
      fastsurfer-home: ${{ steps.parse-version.outputs.FASTSURFER_HOME }}
    steps:
      - name: 'Check whether the tests should run'
        id: parse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # through the environment rather than interpolated into the script below: an expression is
          # substituted before bash parses the line, so a value containing $(...) would run
          INPUT_DOCKER_IMAGE: ${{ inputs.docker-image }}
          INPUT_REFRESH_CACHE: ${{ inputs.refresh-cache }}
        run: |
          # None of this block runs. It is here because GitHub echoes the rendered script into the
          # log, so the comments and the heredoc body are how the run records what triggered it.
          # Quoted delimiter, so the interpolated JSON is recorded rather than expanded.
          # Workflow: ${{ github.workflow }}
          # Event Name: ${{ github.event_name }}
          # Branch: ${{ github.ref_name }}
          # Event Triggered by: ${{ github.event.sender.login }}
          # workflow_dispatch-Event
          # Inputs:
          cat > /dev/null <<'ENDOFINPUTS'
          ${{ toJSON(inputs) }}
          ENDOFINPUTS

          gh_header=(-H "Accept: application/vnd.github+json"
                     -H "X-GitHub-Api-Version: 2022-11-28")
          # collected in variables and written once at the end, so that a later decision cannot
          # leave two values of the same key in the output file. A refusal exits non-zero rather
          # than falling through: reaching the end with the tests skipped would report this workflow
          # as passed without it having tested anything.
          continue_tests="false"
          docker_image="build-cached"
          # whether this run resolves its dependencies afresh rather than restoring them, see the
          # cache block at the end of this step
          refresh_cache="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]
          then
            # only a dispatch carries inputs, and only write access can start one, so there is
            # nothing further to check here
            continue_tests="true"
            if [[ -n "$INPUT_DOCKER_IMAGE" ]] ; then docker_image="$INPUT_DOCKER_IMAGE" ; fi
            if [[ "$INPUT_REFRESH_CACHE" == "true" ]] ; then refresh_cache="true" ; fi
          elif [[ "${{ github.event_name }}" == "schedule" ]]
          then
            # Nightly only pays for itself when there is something new to test, so most nights stop
            # here. Sunday runs whatever happened: an unchanged branch that produces a changed
            # result is the base image, the runner or a dependency moving under us, and a run gated
            # purely on our own commits can never see that.
            #
            # 25 rather than 24 hours, so a commit landing near the cron time is not missed by a run
            # that starts a minute late. The cost of the overlap is at most one extra run.
            since="$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
            # fail open: the gate is an optimisation, and an api that is down or rate limited must
            # not quietly turn the nightly test off for as long as it stays down
            commits_known="true"
            if ! new_commits="$(gh api "${gh_header[@]}" \
                                "/repos/${{ github.repository }}/commits?sha=${{ github.ref_name }}&since=$since" \
                                --jq "length")"
            then
              echo "Could not list recent commits, so running rather than skipping on a guess."
              new_commits=1
              commits_known="false"
            fi
            if [[ "$(date -u +%u)" == "7" ]]
            then
              echo "Weekly baseline run, testing ${{ github.ref_name }} whether or not it moved."
              continue_tests="true"
              refresh_cache="true"
              # The baseline is worth reading because it varies the dependencies while the code
              # stands still, so a difference points at the environment. A commit landing the same
              # day breaks that and nothing in the result would show it, hence saying so here.
              # Only when the count is known: the fail-open branch above guesses 1.
              if [[ "$commits_known" == "true" && "$new_commits" -gt 0 ]]
              then
                # "at least", because the api returns one page and stops counting at 30
                confounded="At least $new_commits commit(s) also landed on ${{ github.ref_name }} since $since,"
                confounded="$confounded so a difference in this run is not attributable to the dependencies alone."
                echo "::warning title=Baseline run is confounded::$confounded"
                printf '### Baseline run is confounded\n\n%s\n' "$confounded" >> "$GITHUB_STEP_SUMMARY"
              fi
            elif [[ "$new_commits" -gt 0 ]]
            then
              echo "$new_commits commit(s) on ${{ github.ref_name }} since $since."
              continue_tests="true"
            else
              echo "Nothing new on ${{ github.ref_name }} since $since and this is not the weekly"
              echo "  baseline run, so there is nothing to test."
            fi
          else #  this event has no specific rules (invalid)
            echo "This workflow is not defined for the event ${{ github.event_name }}!"
            exit 1
          fi
          {
            echo "CONTINUE=$continue_tests"
            echo "DOCKER_IMAGE=$docker_image"
          } >> "$GITHUB_OUTPUT"
          echo "EXTRA_ARGS=" >> $GITHUB_OUTPUT

          # build.py turns this into --cache-from and --cache-to for buildx. Written to GITHUB_ENV
          # rather than set as a job-level env, because the scope below is computed here and because
          # a step-level env does not reach the steps of the composite action that runs the build,
          # while the job environment does.
          #
          # ignore-error, so that a rejected or truncated export costs the cache and not the run:
          # without it a cache failure fails this job and the test jobs never start.
          #
          # mode=max, because only that exports the build_venv stage: min would cache the final
          # image's layers, but buildkit still has to rebuild build_venv to know whether the layer
          # that copies from it is current, so the dependency install would not be skipped.
          #
          # scope names the index only. This backend writes one cache entry per layer blob, so the
          # caches page shows an `index-pipelinetest` entry plus a `buildkit-blob-...` entry per
          # layer. Blobs are keyed by content digest and shared, so a rebuild of unchanged layers
          # reuses them rather than adding more. One scope, always, so only one image's worth of
          # layers is live: the quota is 10 GB for the whole repository and the image is the bulk
          # of it, so check https://github.com/Deep-MI/FastSurfer/actions/caches if other workflows
          # start missing their caches.
          echo "FASTSURFER_BUILD_CACHE=type=gha,mode=max,ignore-error=true,scope=pipelinetest" >> "$GITHUB_ENV"

          # The baseline run resolves its dependencies rather than restoring them, and still writes
          # what it resolved so the rest of the week reuses it. Without this the dependency layer
          # never moves: it lives in build_venv, `COPY . /fastsurfer/` is in a later stage, and its
          # key is the two bind-mounted files, so no amount of committing invalidates it and a new
          # release on PyPI is invisible to it. A run that restored that layer is only showing that
          # our own code is deterministic, never that the environment held still.
          #
          # Read and write have to be separable for that. The variable below is the default for
          # build.py --refresh_cache, which the composite action cannot pass because its inputs are
          # fixed. Pointing the baseline at an unwritten scope name would not do instead: a name
          # nothing has written is also a name nothing can read the next night.
          if [[ "$refresh_cache" == "true" ]]
          then
            echo "Resolving dependencies afresh for this run, and writing the result to the cache."
            echo "FASTSURFER_BUILD_CACHE_REFRESH=1" >> "$GITHUB_ENV"
          fi
      - name: Checkout repository
        # DOCKER_IMAGE is build-cached => we want to build, check this repository out to build the
        # docker image
        if: steps.parse.outputs.CONTINUE == 'true' && steps.parse.outputs.DOCKER_IMAGE == 'build-cached'
        uses: actions/checkout@v7
        with:
          # the commit rather than the branch or the merge ref, both of which move: this job and the
          # test jobs check out separately, an hour or so apart, and have to agree on what was built
          ref: ${{ github.sha }}
      - name: Setup uv and Python (shipped default)
        # uv is only used by the build below, and its post step saves a cache, which fails when
        # nothing has used uv, so this carries the same condition as the build steps
        if: steps.parse.outputs.CONTINUE == 'true' && steps.parse.outputs.DOCKER_IMAGE == 'build-cached'
        uses: astral-sh/setup-uv@v7
        with:
          # keep in sync with tool.python.version in pyproject.toml. It cannot be read from there:
          # this step is what provides the interpreter that reads pyproject.toml in the first place.
          # This python only reads toml and drives build.py; FastSurfer itself runs inside the
          # container, so this value does not affect any test result. Any version >= 3.11 satisfies
          # the stdlib tomllib requirement below.
          python-version: '3.12'
      - name: Get the FreeSurfer version
        # we want to build the docker image, get what we want to do for freesurfer (read fslink from install_pruned.sh,
        if: steps.parse.outputs.CONTINUE == 'true' && steps.parse.outputs.DOCKER_IMAGE == 'build-cached'
        shell: bash
        id: parse-version
        run: |
          # get the FreeSurfer version from pyproject.toml
          {
            # --no-project, because read_toml.py imports only the standard library. Without it uv
            # installs the whole project first, which pulls the CUDA wheels onto a cpu-only runner
            # and takes minutes, and setup-uv prunes those wheels from its cache so it repeats
            # every run.
            fs_version="$(uv run --no-project python ./tools/read_toml.py --file ./pyproject.toml --key tool.freesurfer.version)"
            fs_version_short="${fs_version//\./}"
            echo "FS_VERSION=$fs_version"
            echo "FS_VERSION_SHORT=$fs_version_short"
            if [[ -n "${{ inputs.freesurfer-build-image }}" ]] ; then
              echo "FS_BUILD_IMAGE=${{ inputs.freesurfer-build-image }}"
            else
              echo "FS_BUILD_IMAGE=deepmi/fastsurfer-build:freesurfer$fs_version_short"
            fi
            echo "FASTSURFER_HOME=$(pwd)"
          } > $GITHUB_OUTPUT
      - name: Expose the actions cache to buildx
        # type=gha needs ACTIONS_RESULTS_URL and ACTIONS_RUNTIME_TOKEN in the environment. Only
        # docker/build-push-action injects them on its own, and build.py drives buildx directly, so
        # without this step the cache resolves to nothing and the build silently stays cold.
        if: steps.parse.outputs.CONTINUE == 'true' && steps.parse.outputs.DOCKER_IMAGE == 'build-cached'
        uses: crazy-max/ghaction-github-runtime@v4
      - uses: Deep-MI/FastSurfer/.github/actions/build-docker@dev
        if: steps.parse.outputs.CONTINUE == 'true' && steps.parse.outputs.DOCKER_IMAGE == 'build-cached'
        # This action needs the "full" checkout (located at ${{ inputs.fastsurfer-home }})
        with:
          fastsurfer-home: ${{ steps.parse-version.outputs.FASTSURFER_HOME }}
          # currently, this image has to be updated and used to circumvent storage limitations in github actions
          # and it is also faster to use this prebuilt, reduced-size freesurfer distribution
          freesurfer-build-image: "${{ steps.parse-version.outputs.FS_BUILD_IMAGE }}"
  fastsurfer-test:
    # The resolution goes first: this is a matrix, and without it both entries showed the same
    # name, so a failure gave no clue which one it was.
    name: '${{ matrix.subject-id }} run and tests'
    needs: build-docker
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: needs.build-docker.outputs.continue == 'true'
    strategy:
      # the following matrix strategy will result in one run per subject as matrix is "one-dimensional".
      # Additional parameters under "include" are then added as additional (dependent) information
      matrix:
        subject-id: [0.8mm, 1.0mm]
        include:
          # artifact-id is the subject in micrometres, zero padded, so the name carries no dot and the
          # artifacts sort by resolution. GitHub serves an artifact as <name>.zip and Safari on macOS
          # reads ".8mm.zip" as the extension, so a "0.8mm" artifact arrives unpacked as "0".
          # subject-id itself cannot change: it is also the subject directory name and has to match
          # the reference tarball.
          - subject-id: 1.0mm
            artifact-id: 1000um
            file-extension: ".mgz"
            image-key: QUICKTEST_IMAGE_HREF_1mm
            case-key: QUICKTEST_TARGET_HREF_1mm
            extra-args: ""
          - subject-id: 0.8mm
            artifact-id: 0800um
            file-extension: ".nii.gz"
            image-key: QUICKTEST_IMAGE_HREF_08mm
            case-key: QUICKTEST_TARGET_HREF_08mm
            extra-args: "--3T"
    steps:
      - name: Report the runner CPU
        # which vector kernels torch selects follows the vendor, so two runs are only comparable
        # once this is known. First step, because the same information inside the container arrives
        # minutes later, after the image has been pulled or built.
        shell: bash
        run: |
          # || true, because bash runs with set -e here and a diagnostic must not fail the job on a
          # runner whose /proc/cpuinfo lacks these fields
          grep -m1 vendor_id /proc/cpuinfo || true
          grep -m1 'model name' /proc/cpuinfo || true
      - name: Check out the repository that is to be tested
        uses: actions/checkout@v7
        with:
          # the same commit the image was built from, see the build job
          ref: ${{ github.sha }}
      - name: Run FastSurfer for ${{ matrix.subject-id }} with the previously created docker container
        uses: Deep-MI/FastSurfer/.github/actions/run-fastsurfer@dev
        with:
          subject-id: ${{ matrix.subject-id }}
          artifact-id: ${{ matrix.artifact-id }}
          file-extension: ${{ matrix.file-extension }}
          image-href: ${{ secrets[matrix.image-key] }}
          license: ${{ secrets.QUICKTEST_LICENSE }}
          docker-image: ${{ needs.build-docker.outputs.docker-image }}
          extra-args: ${{ matrix.extra-args }} ${{ needs.build-docker.outputs.extra-args }}
          cleanup: 'false'
      - name: Run tests
        uses: Deep-MI/FastSurfer/.github/actions/run-tests@dev
        with:
          subject-id: ${{ matrix.subject-id }}
          artifact-id: ${{ matrix.artifact-id }}
          subjects-dir: ${{ env.SUBJECTS_DIR }}
          reference-dir: ${{ env.REFERENCE_DIR }}
          case-href: ${{ secrets[matrix.case-key] }}
  annotation:
    name: 'results annotation'
    runs-on: ubuntu-latest
    needs: [fastsurfer-test, build-docker]
    # !cancelled() rather than always(): this still reports when the tests ran and failed, which is
    # the point, but a run cancelled by hand skips it and stays grey instead of going red for work
    # nobody asked it to finish. The continue clause skips it for a run that was never going to
    # test anything, such as a scheduled night on which nothing was committed.
    if: ${{ !cancelled() && needs.build-docker.outputs.continue == 'true' }}
    steps:
      - name: Retrieve test JUnit files
        uses: actions/download-artifact@v8
        with:
          # the sha is shortened in the artifact name, and artifacts are scoped to this run anyway
          pattern: fastsurfer-*-junit-*
          merge-multiple: 'true'
          path: /tmp
      - name: Write the results into the check
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: /tmp/fastsurfer-*-junit-*.xml
          # This is the only annotation step that creates a check run, the others set
          # annotate_only. Name it for what it is: github prefixes the check with a workflow of its
          # own choosing, which has read "AUTO code-style / pipelinetest results", so the name itself
          # has to say where the results came from.
          check_name: pipelinetest results
          fail_on_failure: 'true'
          fail_on_parse_error: 'true'
          # Without this, a run whose tests were cancelled or skipped reports "No test results
          # found" and passes, so a pipelinetest that tested nothing looks like a pipelinetest that
          # passed. The job already only runs when the tests were meant to run.
          require_tests: 'true'
