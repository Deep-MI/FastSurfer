name: test

# File: test.yaml
# Author: David Kügler
# Created on: 2025-09-08
# Functionality: This workflow runs unit tests defined in tests/image.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: write
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  image-test:
    name: 'Run FastSurfer unit tests from test/${{ matrix.tests }}'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        # image: image-processing unit tests. config: consistency of declared versions across
        # pyproject.toml, the Dockerfile and the workflows (see test/config/test_python_version.py).
        # test/shell is deliberately absent: its static half only reads files and runs in the much
        # lighter code-style workflow, and its functional half needs a real bash 3.2, so it runs in
        # the macos-shell-test job below. Adding it here would spin up a whole job, including the
        # quicktest dependency install, to execute a text scan.
        tests: ["image", "config"]
        pytest-flags: [""]

    steps:
      - uses: actions/checkout@v7
      - name: Setup Python 3.10 (oldest supported)
        uses: actions/setup-python@v7
        with:
          # deliberately NOT tool.python.version (the shipped default): this job pins the lower
          # bound from project.requires-python so that the supported-version claim stays tested.
          # Bump this only when requires-python itself is raised.
          python-version: '3.10'
          architecture: 'x64'
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        shell: bash
        # uses the same python environment as quicktest
        run: |
          echo "::group::Create python environment"
          python -m pip install --progress-bar off --upgrade pip setuptools wheel
          python -m pip install --progress-bar off .[quicktest]
          echo "::endgroup::"
      # run pytest checks for data consistency/quality
      - name: Run pytest
        env:
          PYTHON_PATH: .
          FASTSURFER_HOME: ${{ github.workspace }}
        shell: bash
        continue-on-error: true  # pytest only exits with code 0, if all tests pass
        run: |
          echo "::group::Run tests"
          flags=("--junit-xml=/tmp/fastsurfer-unittest-${{ matrix.tests }}.junit.xml")
          if [[ "$ACTION_RUNNER_DEBUG" == "true" ]]
          then 
            flags+=(-vv --log_cli_level=DEBUG)
          fi
          python -m pytest "${flags[@]}" ${{ matrix.pytest-flags }} test/${{ matrix.tests }}
          echo "::endgroup::"
      - name: Upload the JUnit XML file as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: fastsurfer-${{ github.sha }}-${{ matrix.tests }}-junit
          path: /tmp/fastsurfer-unittest-${{ matrix.tests }}.junit.xml
      - name: Annotate the results into the check
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: /tmp/fastsurfer-unittest-${{ matrix.tests }}.junit.xml
          check_name: Annotate the test results as checks
          fail_on_failure: 'true'
          fail_on_parse_error: 'true'
          # here, we only add the annotations, the fail-state cannot be set here by this action because the github token
          # does not have the required permissions in PRs from forks.
          # See: https://github.com/mikepenz/action-junit-report?tab=readme-ov-file#pr-run-permissions
          annotate_only: 'true'

  macos-shell-test:
    name: 'Run the shell tests under the bash macOS ships'
    # The only place /bin/bash is 3.2, which is what test/shell guards: every shipped script selects
    # it through its own shebang, so a bash-4-only construct breaks macOS while passing on Linux.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        # no `architecture`, unlike the job above: these runners are arm64
        with:
          python-version: '3.10'
      - name: Install pytest
        shell: bash
        run: python -m pip install --progress-bar off --upgrade pip pytest
      - name: Report the bash version, and fail if it is no longer 3.x
        # A deliberate tripwire. If Apple ever ships bash 4+ as /bin/bash the functional tests would
        # silently skip and this guard would rot unnoticed, which is how it drifted before.
        run: |
          /bin/bash -c 'echo "/bin/bash is ${BASH_VERSION}"'
          /bin/bash -c 'test "${BASH_VERSINFO[0]}" -eq 3' || {
            echo "::error::/bin/bash is no longer 3.x; revisit test/shell and the mapfile workarounds"
            exit 1
          }
      - name: Run pytest
        env:
          FASTSURFER_HOME: ${{ github.workspace }}
        shell: bash
        # the bash 3.2 tests, which only run here, plus the fs_time ones for their macOS branches;
        # the latter also run on ubuntu in the code-style workflow, for the linux branches
        run: python -m pytest -v test/shell/test_brun_bash32.py test/shell/test_fs_time.py
